name: CI

# A pull request is checked for what it changes: tools/ci_scope.py reads the diff
# and says which files to lint, which tests to run and which instruments to check
# against their trait files. A change to the core checks every instrument; a change
# to docs checks nothing. A push to main is checked the same way, for what changed
# between the commit main was at before the push and the pushed one. When GitHub
# names no earlier commit, or the runner can't find it, the push checks everything.
# A manual run checks everything.
#
# MicroPython (tests/mpy) has its own job, `mpy`: it builds the unix port with
# ulab and audiodsp and runs `micropython tests/mpy/run.py`. It runs when a change
# touches lib/, tests/mpy/, tools/, examples/, manifest.py or this workflow, and
# not for docs alone; a manual run always runs it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on a pull request replaces the run for the older one. Pushes to
# main are never cancelled: each is checked only for its own changes, so a
# cancelled one would leave those changes unchecked.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The runner's own python3 reads the diff, so a change with no code in it
      # ends here without downloading anything.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci_scope.py --base "$BASE" --out "$RUNNER_TEMP/scope.json" --github
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 tools/ci_scope.py --base "$BEFORE" --out "$RUNNER_TEMP/scope.json" --github
          else
            python3 tools/ci_scope.py --all --out "$RUNNER_TEMP/scope.json" --github
          fi

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.nothing != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # audiodsp 0.6.11 is on TestPyPI until its release; naming a dev release
      # in the requirement lets pip take pre-releases of it, and of nothing else.
      - name: Install
        if: steps.scope.outputs.nothing != 'true'
        run: |
          python -m pip install -q -i https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "omnipython-audiodsp>=0.6.13.dev8" numpy pytest ruff==0.17.1
          python -m pip list 2>/dev/null | grep -iE "^(omnipython-audiodsp|numpy|pytest|ruff) "

      - name: Lint
        if: steps.scope.outputs.lint == 'true'
        run: |
          mapfile -t FILES < <(python tools/ci_scope.py --from "$RUNNER_TEMP/scope.json" --get lint)
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Test
        if: steps.scope.outputs.nothing != 'true'
        run: |
          mapfile -t TESTS < <(python tools/ci_scope.py --from "$RUNNER_TEMP/scope.json" --get pytest)
          if [ "${#TESTS[@]}" -gt 0 ]; then python -m pytest -q "${TESTS[@]}"; fi

  # The MicroPython half of the tests: the same rack on a unix MicroPython built
  # with audiodsp and ulab, with the pins below. Documentation-only changes can't
  # change the result, so they skip the build.
  mpy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MICROPYTHON_REF: v1.29.0
      ULAB_REF: 6.7.3
      AUDIODSP_REF: v0.6.16.dev0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: audioinstruments

      - name: Scope
        id: scope
        working-directory: audioinstruments
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ -n "${BASE//0/}" ] \
              && git cat-file -e "$BASE^{commit}" 2>/dev/null; }; then
            if git diff --name-only "$BASE" HEAD \
                | grep -qE '^(lib/|tests/mpy/|tools/|examples/|manifest\.py$|\.github/workflows/ci\.yml$)'; then
              run=true
            else
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "MicroPython tests run: $run"

      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
        with:
          repository: PyDevices/audiodsp
          ref: ${{ env.AUDIODSP_REF }}
          path: modules/audiodsp

      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
        with:
          repository: v923z/micropython-ulab
          ref: ${{ env.ULAB_REF }}
          path: ulab-src

      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
        with:
          repository: micropython/micropython
          ref: ${{ env.MICROPYTHON_REF }}
          path: micropython

      # The interpreter depends only on the three pins, so a change to the
      # instruments reuses the build.
      - name: Cache the interpreter
        id: build-cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: micropython/ports/unix/build-standard/micropython
          key: mpy-unix-${{ env.MICROPYTHON_REF }}-${{ env.ULAB_REF }}-${{ env.AUDIODSP_REF }}

      # USER_C_MODULES is the parent folder: py.mk takes every */micropython.mk
      # one level down, which is audiodsp and ulab.
      - name: Build unix MicroPython with audiodsp and ulab
        if: steps.scope.outputs.run == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          ln -s "$GITHUB_WORKSPACE/ulab-src/code" modules/ulab
          (cd modules/audiodsp && ./scripts/fetch_deps.sh)
          make -C micropython/mpy-cross -j2
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j2 USER_C_MODULES="$GITHUB_WORKSPACE/modules"

      - name: Run tests/mpy
        if: steps.scope.outputs.run == 'true'
        working-directory: audioinstruments
        run: |
          MP="$GITHUB_WORKSPACE/micropython/ports/unix/build-standard/micropython"
          "$MP" -c "import ulab, audiocore, audiograph; print('modules ok')"
          timeout 900 "$MP" tests/mpy/run.py | tee "$RUNNER_TEMP/mpy.txt"
          grep -Eq '^[0-9]+ tests, 0 failures$' "$RUNNER_TEMP/mpy.txt"
