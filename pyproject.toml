[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-audioinstruments"
dynamic = ["version"]
description = "Playable synthesizers, organs and electric pianos built on a virtual rack, on audiodsp, for CPython and MicroPython"
readme = "README.md"
authors = [{ name = "Brad Barnett" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["instruments", "synthesizer", "eurorack", "audio", "dsp", "micropython", "midi"]
dependencies = [
    "numpy>=1.20",
    "omnipython-audiodsp>=0.6.13.dev2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["lib"]

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = ["E", "F", "I", "W", "B", "SIM"]
lint.ignore = ["E501", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mpy"]
pythonpath = ["lib", "."]
